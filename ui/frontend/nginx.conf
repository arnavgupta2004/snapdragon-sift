server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # SSE (GET /api/query/stream) needs buffering off, or the live trace panel
        # would just see one big chunk at the end instead of streaming events.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri /index.html;
    }
}
